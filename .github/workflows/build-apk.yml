name: Build Yawmi APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Unpack Yawmi source
        run: |
          rm -rf yawmi-src
          mkdir yawmi-src
          unzip -o Yawmi_Source.zip -d yawmi-src

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        run: gradle -p yawmi-src :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp yawmi-src/app/build/outputs/apk/debug/app-debug.apk Yawmi.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yawmi-APK
          path: Yawmi.apk
